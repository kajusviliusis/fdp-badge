spring:
  application:
    name: bookworm-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookworm}
    username: ${DB_USERNAME:bookworm}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  jackson:
    default-property-inclusion: non_null

bookworm:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl: PT1H
      issuer: bookworm-api
  pricing:
    tax-rate: 0.12
    free-delivery-threshold: 500.00
    delivery-charge: 40.00
  gift-points:
    rupees-per-point: 10

server:
  address: 127.0.0.1
  port: 8080
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
