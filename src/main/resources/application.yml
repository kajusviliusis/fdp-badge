spring:
  application:
    name: bookworm-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookworm}
    username: ${DB_USERNAME:bookworm}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

server:
  address: 127.0.0.1
  port: 8080
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
